name: Keep API warm

# Backup only: the API pings itself every 10 minutes (services/api/app/core/keep_warm.py).
# GitHub delays and sometimes skips scheduled runs, so this cannot keep the service
# awake alone; it wakes it again if it was ever asleep (e.g. after a Render restart
# before the first request). No secrets needed.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.MCHO_API_URL || 'https://mcho-api.onrender.com' }}
    steps:
      - name: Ping the API health endpoint
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --silent --fail --max-time 60 --output /dev/null "$API_URL/api/v1/health/live"; then
              echo "API awake"; exit 0
            fi
            echo "Not ready (attempt $attempt); retrying…"; sleep 20
          done
          echo "API did not answer within about 3 minutes." >&2
          exit 1
