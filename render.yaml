# Render Blueprint for a small MCHO pilot. Applying it creates billable cloud resources.
# Review service plans and recurring costs in Render before provisioning.
services:
  - type: keyvalue
    name: mcho-queue
    region: singapore
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: mcho-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    autoDeployTrigger: checksPass
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: mcho-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mcho-queue
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: mcho-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./services/workers/Dockerfile
    dockerContext: ./services/workers
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: mcho-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mcho-queue
          type: keyvalue
          property: connectionString

  - type: web
    name: mcho-web
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_ORIGIN
        fromService:
          name: mcho-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_MAP_STYLE_URL
        value: ""

databases:
  - name: mcho-db
    databaseName: mcho
    user: mcho
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
