name: MCHO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests and PostGIS migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: mcho_test
          POSTGRES_USER: mcho
          POSTGRES_PASSWORD: mcho_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcho -d mcho_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+psycopg://mcho:mcho_test_password@localhost:5432/mcho_test
      APP_ENV: test
      MCHO_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and test dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile Python source
        run: python -m compileall -q app alembic tests
      - name: Apply migrations on PostGIS
        run: alembic upgrade head
      - name: Run contract and policy tests
        run: pytest -q

  worker-tests:
    name: Ingestion connector tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and worker dependencies
        run: python -m pip install --upgrade pip && pip install -e "../api[dev]" -r requirements.txt
      - name: Compile worker source
        run: python -m compileall -q mcho_workers tests
      - name: Run no-network connector and normalization tests
        run: PYTHONPATH=. python -m pytest -q tests

  web-build:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test OIDC BFF, cookie token custody and CSRF
        run: npm run test:auth
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
          NEXT_PUBLIC_MAP_STYLE_URL: ""
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run demo browser acceptance tests
        run: npm run test:e2e
      - name: Upload browser test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mcho-demo-playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/playwright/
          retention-days: 14

  container-builds:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate smoke-test shell syntax
        run: bash -n scripts/smoke-test.sh
      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - name: Build API image
        run: docker build --pull -f services/api/Dockerfile -t mcho-api:ci services/api
      - name: Build worker image
        run: docker build --pull -f services/workers/Dockerfile -t mcho-worker:ci .
      - name: Build frontend image using the same-origin runtime proxy
        run: >-
          docker build --pull
          --build-arg NEXT_PUBLIC_MAP_STYLE_URL=
          -f apps/web/Dockerfile
          -t mcho-web:ci apps/web
