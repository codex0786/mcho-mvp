# Free-tier Render Blueprint for the MCHO API. See docs/deploy-free-tier.md.
#
# Creates ONE Render resource: a free Docker web service for the FastAPI API.
# PostgreSQL/PostGIS (Neon) and Redis (Upstash) are external free services whose
# connection strings you enter when applying the Blueprint; nothing is hard-coded.
#
# Free-tier constraints this file accounts for:
# - preDeployCommand is paid-only, so the image's start script applies migrations
#   when RUN_MIGRATIONS_ON_START=1 (Alembic is a no-op at head; one free instance).
# - Free web services sleep after 15 idle minutes; the first request then takes
#   about a minute.
# - No Celery worker: Render has no free background workers. Manual ingestion
#   requests return 503 until a worker exists; public read endpoints are unaffected.
# The paid pilot Blueprint (API + worker + Render Postgres) is deploy/render-paid-pilot.yaml.
services:
  - type: web
    name: mcho-api
    runtime: docker
    plan: free
    # Co-located with Vercel's default function region (iad1); pick the same AWS
    # us-east-1 region for Neon and Upstash.
    region: virginia
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    # Render does not run dockerCommand through a shell that strips quotes, so the
    # image's own start script handles migrations (RUN_MIGRATIONS_ON_START below).
    dockerCommand: /app/start.sh
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # preDeployCommand is paid-only, so migrations run at container start.
      - key: RUN_MIGRATIONS_ON_START
        value: "1"
      # Neon *direct* (non-pooled) connection string, e.g.
      # postgresql://USER:PASSWORD@ep-xxxx.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Upstash TLS URL with ssl_cert_reqs appended, e.g.
      # rediss://default:PASSWORD@xxxx.upstash.io:6379?ssl_cert_reqs=required
      - key: REDIS_URL
        sync: false
      # Browsers reach the API only through the Vercel same-origin proxy, so CORS is
      # limited to the public web origin.
      - key: CORS_ORIGINS
        value: https://mcho-mvp.vercel.app
      # Sign-in (docs/auth0-setup.md). Set these in the Render dashboard; sync: false
      # keeps Blueprint syncs from overwriting them. Until set, reviewer/publisher/
      # admin endpoints fail closed (503).
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URL
        sync: false
      - key: OIDC_ROLE_CLAIM
        sync: false
      - key: OIDC_ALGORITHMS
        value: RS256
