name: MCHO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests and PostGIS migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: mcho_test
          POSTGRES_USER: mcho
          POSTGRES_PASSWORD: mcho_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcho -d mcho_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+psycopg://mcho:mcho_test_password@localhost:5432/mcho_test
      APP_ENV: test
      REVIEWER_API_KEY: ci-only-not-a-production-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and test dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile Python source
        run: python -m compileall -q app alembic tests
      - name: Apply migrations on PostGIS
        run: alembic upgrade head
      - name: Run contract and policy tests
        run: pytest -q

  web-build:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
          NEXT_PUBLIC_MAP_STYLE_URL: ""
